<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" fill="none" role="img" aria-label="StormBreaker is alive">
  <defs>
    <radialGradient id="sbGlow" cx="80%" cy="16%" r="62%">
      <stop offset="0" stop-color="#C7E7FF" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#C7E7FF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="sbGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" stroke="#C7E7FF" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
    <filter id="sbSoft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="440" fill="#0a0a12"/>
  <rect width="1200" height="440" fill="url(#sbGrid)"/>
  <rect width="1200" height="440" fill="url(#sbGlow)"/>

  <!-- heartbeat: "alive" -->
  <polyline points="70,224 322,224 350,224 366,120 384,330 402,180 418,224 476,224 760,224"
    stroke="#C7E7FF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" filter="url(#sbSoft)"/>

  <!-- lightning bolt: "the storm" -->
  <g filter="url(#sbSoft)" transform="translate(928,92) scale(11)">
    <path d="M13 2 4 14h6l-1 8 9-12h-6z" fill="#C7E7FF"/>
  </g>
</svg>
